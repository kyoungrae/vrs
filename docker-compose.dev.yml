# Full stack: Oracle + PHP app (use profile "app").
#
# 1. Copy .env.example to .env and set DB_* for the oracle service below.
# 2. docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile app up --build
#
# Default DB_* for gvenzl/oracle-free (empty DB — import VRS from your team):
#   DB_CONNECTION=oracle
#   DB_HOST=oracle
#   DB_PORT=1521
#   DB_DATABASE=freepdb1
#   DB_USERNAME=system
#   DB_PASSWORD=DevOraclePass123   (match LOCAL_ORACLE_PASSWORD in .env)
#   DB_SERVICE_NAME=FREEPDB1

services:
  app:
    image: yajra/laravel-oci8:7.4-apache
    container_name: laravel-vrs
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=oracle
      - DB_HOST=192.168.0.140
      - DB_PORT=11521
      - DB_DATABASE=orcl
      - DB_USERNAME=vrs
      - DB_PASSWORD=oracle12c!vrs#
      - DB_SERVICE_NAME=orcl
      - APP_ENV=local
      - APP_DEBUG=true
    working_dir: /var/www/html
    restart: unless-stopped